server:
  port: ${PORT:8081}
spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:smartvault}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory}
    username: ${DB_USER:${PGUSER:smartvault}}
    password: ${DB_PASSWORD:${PGPASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  demo-allowed-emails: ${DEMO_ALLOWED_EMAILS:}
  restrict-registration: ${RESTRICT_REGISTRATION:true}
  jwt-secret: ${JWT_SECRET}
  service-key: ${SERVICE_KEY}
