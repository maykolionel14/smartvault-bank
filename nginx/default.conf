server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/v1/identity/ { proxy_pass http://identity:8081; proxy_set_header Host $host; }
    location /api/v1/ledger/ { proxy_pass http://ledger:8082; proxy_set_header Host $host; }
    location /api/v1/vaults { proxy_pass http://vaults:8083; proxy_set_header Host $host; }
    location /api/v1/reports/ { proxy_pass http://reports:8084; proxy_set_header Host $host; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
