server:
  port: ${PORT:8084}
spring:
  application:
    name: reports-service
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt-secret: ${JWT_SECRET}
  service-key: ${SERVICE_KEY}
  identity-url: ${IDENTITY_URL:http://localhost:8081}
  ledger-url: ${LEDGER_URL:http://localhost:8082}
